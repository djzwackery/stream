name = "zw-twitch-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Created once via `wrangler kv namespace create TOKENS`, see worker/README.md.
# Paste the id it prints here.
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# Caps abuse of /twitch/avatar (the one endpoint with no origin check, see
# worker/README.md's security model) at 20 requests/minute per IP. Free,
# built into the platform, no KV/external calls needed to enforce it.
[[ratelimits]]
name = "AVATAR_RATE_LIMITER"
namespace_id = "1"

  [ratelimits.simple]
  limit = 20
  period = 60

# Free tier only supports the SQLite storage backend for Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[triggers]
# Twitch access tokens last a few hours; refreshing well inside that window
# leaves margin if a single refresh attempt fails.
crons = ["0 */3 * * *"]
