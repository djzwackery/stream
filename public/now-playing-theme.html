<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DJ Zwackery Now Playing theme</title>
    <!--
  Custom HTML theme for the Now Playing app (nowplayingapp.com): Settings ->
  Theme Editor -> Custom HTML -> Select HTML file -> this file. Now Playing
  serves it from its own local server (jQuery/socket.io get injected, but
  this page doesn't use them) and calls window.onTrackUpdate/onHide/onShow,
  which zw-nowplaying.js already implements. Point your OBS/Streamlabs browser
  source at Now Playing's own URL (e.g. http://localhost:9000), not this file directly.
  Recommended source size: 1920 x 1080, same as now-playing.html.

  Unlike now-playing.html, the script below uses an absolute URL: Now
  Playing's server has no js/ folder of its own to resolve a relative path
  against. Its own internal imports still resolve fine cross-origin: GitHub
  Pages sends `Access-Control-Allow-Origin: *` on every file it serves.

  The ?v= on that script tag isn't a real version scheme, just a cache
  buster: confirmed live that a fix landing on djzwackery.com and working in
  a plain browser tab still didn't reach Now Playing's own embedded browser,
  which appears to cache this URL more persistently than OBS's own browser
  source does. Bump the value whenever zw-nowplaying.ts or NowPlaying.ts
  changes, or a fix here won't actually reach anyone using this file until
  they re-select it in Now Playing's Theme Editor anyway.
-->
    <link rel="stylesheet" href="https://djzwackery.com/stream/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #root {
        position: fixed;
        inset: auto 2.5rem 2.5rem auto;
        display: flex;
        justify-content: flex-end;
        font-family: var(--font-body);
        color: var(--white);
      }
      a {
        color: var(--cyan);
      }
      a:hover {
        color: var(--sun);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="https://djzwackery.com/stream/js/zw-nowplaying.js?v=2026-08-22a"
    ></script>
  </body>
</html>
