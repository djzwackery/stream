<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DJ Zwackery: status</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--void);
        color: var(--white);
        font-family: var(--font-body);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        min-height: 100vh;
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 2rem;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: var(--ink-dim);
        max-width: 70ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 1.25rem;
        max-width: 960px;
      }
      .card {
        background: var(--void-2);
        border: var(--edge) solid var(--void);
        box-shadow: var(--shadow-hard);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .card h2 {
        margin: 0;
        font-family: var(--font-label);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.75rem;
        color: var(--acid);
      }
      .card .value {
        font-family: var(--font-display);
        font-size: 1.6rem;
        text-transform: uppercase;
      }
      .card .detail {
        color: var(--ink-dim);
        font-size: 0.85rem;
      }
      .card[data-state="ok"] .value {
        color: var(--acid);
      }
      .card[data-state="warn"] .value {
        color: var(--sun);
      }
      .card[data-state="error"] .value {
        color: var(--magenta);
      }
    </style>
  </head>
  <body>
    <h1>Status</h1>
    <p>
      Live health of the Twitch relay Worker: leave this open on a second
      monitor, or check it before going live. Refreshes every 15 seconds.
    </p>
    <div class="grid">
      <div class="card" id="card-token" data-state="warn">
        <h2>Twitch token</h2>
        <div class="value" id="token-value">Checking…</div>
        <div class="detail" id="token-detail"></div>
      </div>
      <div class="card" id="card-redemption" data-state="warn">
        <h2>Last redemption</h2>
        <div class="value" id="redemption-value">Checking…</div>
      </div>
      <div class="card" id="card-clients" data-state="warn">
        <h2>OBS sources connected</h2>
        <div class="value" id="clients-value">Checking…</div>
      </div>
    </div>
    <script src="js/status.js"></script>
  </body>
</html>
